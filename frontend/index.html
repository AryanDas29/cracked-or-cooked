<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Cracked or Cooked</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --red:#e8321c;
  --orange:#f07020;
  --gold:#e8a020;
  --blue:#2050c8;
  --blue-dim:#0e1a3a;
  --bg:#07090e;
  --card-w:300px;
}

body{
  font-family:'Barlow Condensed',sans-serif;
  background:var(--bg);
  min-height:100vh;
  color:#e8eaf0;
  overflow-x:hidden;
}

/* ── Atmospheric BG ─────────────────────────────── */
#bg-canvas{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 55% 70% at 15% 55%, rgba(210,45,15,0.09) 0%, transparent 65%),
    radial-gradient(ellipse 55% 70% at 85% 55%, rgba(20,55,200,0.09) 0%, transparent 65%),
    radial-gradient(ellipse 80% 40% at 50% 105%, rgba(100,15,15,0.18) 0%, transparent 55%),
    #07090e;
}
/* animated scan line */
#bg-canvas::after{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 59px,rgba(255,255,255,0.012) 60px);
  animation:scanSlide 18s linear infinite;
}
@keyframes scanSlide{to{background-position:0 -600px}}

#wrap{position:relative;z-index:1}

/* ── Title ──────────────────────────────────────── */
.title-main{
  font-size:clamp(3rem,7vw,5.5rem);
  font-weight:900;letter-spacing:.18em;text-transform:uppercase;
  background:linear-gradient(130deg,#ff3a20 0%,#ff7a20 45%,#ffc030 80%,#ffe060 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 28px rgba(255,80,10,.35));
  line-height:1;
}
.title-sub{
  font-size:.72rem;letter-spacing:.55em;text-transform:uppercase;
  color:#3a4460;font-weight:600;margin-top:8px;
}

/* ── Diamond divider ────────────────────────────── */
.divider{display:flex;align-items:center;gap:10px}
.divider-line{flex:1;height:1px}
.divider-diamond{width:7px;height:7px;transform:rotate(45deg);flex-shrink:0}

/* ── Input form ─────────────────────────────────── */
.form-panel{
  background:rgba(255,255,255,.025);
  border:1px solid rgba(255,255,255,.06);
  backdrop-filter:blur(6px);
}
.player-tag{
  font-size:.65rem;letter-spacing:.45em;text-transform:uppercase;
  font-weight:800;margin-bottom:12px;
}
.p1-tag{color:rgba(255,110,40,.7)}
.p2-tag{color:rgba(50,120,230,.7)}

.inp-wrap label{
  display:block;font-size:.6rem;letter-spacing:.35em;text-transform:uppercase;
  color:#3a4460;font-weight:700;margin-bottom:5px;
}
.inp-wrap input{
  width:100%;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.07);
  color:#c8d0e0;
  padding:9px 13px;
  font-family:'Barlow Condensed',sans-serif;
  font-size:.98rem;font-weight:600;letter-spacing:.04em;
  outline:none;
  clip-path:polygon(7px 0%,100% 0%,calc(100% - 7px) 100%,0% 100%);
  transition:border-color .2s,background .2s,box-shadow .2s;
}
.inp-wrap input:focus{
  border-color:rgba(230,80,30,.55);
  background:rgba(230,80,30,.06);
  box-shadow:0 0 16px rgba(230,60,10,.12);
}
.inp-wrap input::placeholder{color:#222840}

/* ── Battle button ──────────────────────────────── */
.battle-btn{
  position:relative;overflow:hidden;
  background:linear-gradient(130deg,#b02010 0%,#d83820 40%,#f06828 100%);
  color:#fff;
  font-family:'Barlow Condensed',sans-serif;
  font-size:1.15rem;font-weight:900;letter-spacing:.5em;text-transform:uppercase;
  padding:13px 52px;border:none;cursor:pointer;
  clip-path:polygon(14px 0%,100% 0%,calc(100% - 14px) 100%,0% 100%);
  transition:transform .15s,box-shadow .2s;
}
.battle-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(130deg,transparent,rgba(255,255,255,.18),transparent);
  transform:translateX(-120%);transition:transform .4s;
}
.battle-btn:hover::before{transform:translateX(120%)}
.battle-btn:hover{
  box-shadow:0 0 45px rgba(255,70,10,.55),0 0 90px rgba(255,50,0,.2);
  transform:scale(1.025);
}
.battle-btn:active{transform:scale(.97)}
.battle-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* ── Loading ────────────────────────────────────── */
#loading{display:none}
#loading.show{display:flex}

.bar-loader{display:flex;align-items:flex-end;gap:5px;height:56px}
.bbar{
  width:7px;border-radius:2px 2px 0 0;
  background:linear-gradient(to top,#b02010,#f06828);
  animation:bpulse 1.1s ease-in-out infinite;
}
.bbar:nth-child(1){animation-delay:.00s}
.bbar:nth-child(2){animation-delay:.09s}
.bbar:nth-child(3){animation-delay:.18s}
.bbar:nth-child(4){animation-delay:.27s}
.bbar:nth-child(5){animation-delay:.36s}
.bbar:nth-child(6){animation-delay:.45s}
.bbar:nth-child(7){animation-delay:.54s}
.bbar:nth-child(8){animation-delay:.63s}
@keyframes bpulse{
  0%,100%{height:10px;opacity:.35}
  50%{height:56px;opacity:1}
}
.load-txt{
  font-size:.72rem;letter-spacing:.45em;text-transform:uppercase;
  color:#3a4460;animation:txtblink 2s ease-in-out infinite;
}
@keyframes txtblink{0%,100%{opacity:.5}50%{opacity:1}}

/* ── Error ──────────────────────────────────────── */
#err-box{display:none}
#err-box.show{
  display:block;
  background:rgba(190,30,20,.1);
  border:1px solid rgba(190,30,20,.35);
  color:#d07070;
  padding:13px 20px;
  font-size:.9rem;letter-spacing:.04em;text-align:center;
  clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
}

/* ── Winner banner ──────────────────────────────── */
#winner-section{display:none}
#winner-section.show{display:block}

.winner-headline{
  font-size:clamp(1.6rem,4.5vw,3.2rem);
  font-weight:900;letter-spacing:.08em;text-transform:uppercase;
  line-height:1.05;
}
.winner-hl-name{
  background:linear-gradient(130deg,#ff3a20,#ff9030,#ffcc40);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 20px rgba(255,80,10,.5));
}
.winner-hl-suffix{color:#fff}

/* ── Cards container ────────────────────────────── */
#cards-area{display:none}
#cards-area.show{display:flex}

/* ── Battle card shell ──────────────────────────── */
.card{
  width:var(--card-w);flex-shrink:0;
  position:relative;
  transition:transform .35s cubic-bezier(.22,1,.36,1);
}
.card.winner{transform:scale(1.06);z-index:2}
.card.loser{transform:scale(.97);z-index:1;opacity:.88}

.card-shell{
  position:relative;overflow:hidden;
  clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));
}

/* Glowing border via pseudo element */
.card-shell::before{
  content:'';position:absolute;inset:-1px;z-index:0;
  clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));
  pointer-events:none;
}
.card.winner .card-shell::before{
  background:linear-gradient(140deg,rgba(255,120,30,.7),rgba(255,60,10,.3),rgba(100,30,10,.1));
  animation:winnerBorder 2.8s ease-in-out infinite;
}
.card.loser .card-shell::before{
  background:linear-gradient(140deg,rgba(40,80,200,.45),rgba(20,40,120,.2));
}
@keyframes winnerBorder{
  0%,100%{opacity:.7}50%{opacity:1}
}

.card-inner{position:relative;z-index:1}

/* ── Card header (image area mock) ─────────────── */
.card-head{
  position:relative;height:180px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;
  padding-bottom:18px;overflow:hidden;
}

.card.winner .card-head{
  background:linear-gradient(175deg,#1e0600 0%,#3c0e00 35%,#5a1800 65%,#1a0500 100%);
}
.card.loser .card-head{
  background:linear-gradient(175deg,#050810 0%,#0b1228 35%,#101b38 65%,#060a18 100%);
}

/* big faded username behind */
.card-head-bg-text{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-size:5.5rem;font-weight:900;letter-spacing:-.02em;
  text-transform:uppercase;
  pointer-events:none;user-select:none;
  overflow:hidden;
}
.card.winner .card-head-bg-text{color:rgba(255,80,20,.07)}
.card.loser  .card-head-bg-text{color:rgba(40,80,200,.07)}

/* geometric accent lines on header */
.card-head::before{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
}
.card.winner .card-head::before{background:linear-gradient(90deg,transparent,rgba(255,100,30,.9),transparent)}
.card.loser  .card-head::before{background:linear-gradient(90deg,transparent,rgba(50,100,220,.6),transparent)}

/* corner L brackets */
.c-tl,.c-br{position:absolute;width:18px;height:18px;pointer-events:none}
.c-tl{top:8px;left:8px;border-top:2px solid;border-left:2px solid}
.c-br{bottom:8px;right:8px;border-bottom:2px solid;border-right:2px solid}
.card.winner .c-tl,.card.winner .c-br{border-color:rgba(255,110,30,.65)}
.card.loser  .c-tl,.card.loser  .c-br{border-color:rgba(50,100,220,.4)}

.card-head-name{
  font-size:1.9rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;
  position:relative;z-index:1;line-height:1;
}
.card.winner .card-head-name{
  color:#fff;text-shadow:0 0 22px rgba(255,100,20,.7),0 2px 4px rgba(0,0,0,.8);
}
.card.loser .card-head-name{
  color:#607090;text-shadow:0 0 12px rgba(40,80,200,.4);
}
.card-head-sub{
  font-size:.6rem;letter-spacing:.45em;text-transform:uppercase;
  font-weight:700;margin-top:3px;position:relative;z-index:1;
}
.card.winner .card-head-sub{color:rgba(255,130,40,.5)}
.card.loser  .card-head-sub{color:rgba(50,100,200,.4)}

/* ── Card body ──────────────────────────────────── */
.card-body{padding:16px 18px 20px}
.card.winner .card-body{background:#0f0500}
.card.loser  .card-body{background:#060810}

/* Verdict badge */
.verdict{
  display:inline-flex;align-items:center;gap:6px;
  padding:3px 14px;margin-bottom:14px;
  font-size:.82rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
  clip-path:polygon(7px 0%,100% 0%,calc(100% - 7px) 100%,0% 100%);
}
.verdict.cracked{
  background:linear-gradient(130deg,#a01808,#d03010);
  color:#fff;box-shadow:0 0 18px rgba(200,40,10,.4);
}
.verdict.cooked{
  background:rgba(20,40,110,.5);
  color:#3a5890;border:1px solid rgba(30,60,160,.3);
}

/* Score */
.score-row{display:flex;align-items:baseline;gap:7px;margin-bottom:14px}
.score-num{
  font-size:3.8rem;font-weight:900;letter-spacing:-.02em;line-height:1;
}
.card.winner .score-num{color:#f06020;text-shadow:0 0 18px rgba(255,70,10,.45)}
.card.loser  .score-num{color:#2a3a60}
.score-lbl{
  font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;
  color:#252e40;font-weight:700;line-height:1.4;
}

/* AI quality bar */
.bar-row{margin-bottom:15px}
.bar-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.bar-hd-lbl{font-size:.58rem;letter-spacing:.32em;text-transform:uppercase;color:#252e40;font-weight:700}
.bar-hd-val{font-size:.72rem;font-weight:800;letter-spacing:.04em}
.card.winner .bar-hd-val{color:#e06020}
.card.loser  .bar-hd-val{color:#2a3a60}
.bar-track{height:2px;background:rgba(255,255,255,.05)}
.bar-fill{height:100%;width:0;transition:width 1.1s cubic-bezier(.22,1,.36,1)}
.card.winner .bar-fill{background:linear-gradient(90deg,#a01808,#f07020);box-shadow:0 0 8px rgba(240,80,10,.5)}
.card.loser  .bar-fill{background:linear-gradient(90deg,#0e1e60,#2050a0)}

/* Section label */
.sec-lbl{
  font-size:.57rem;letter-spacing:.38em;text-transform:uppercase;
  font-weight:800;margin-bottom:6px;
}
.card.winner .sec-lbl{color:rgba(255,100,30,.38)}
.card.loser  .sec-lbl{color:rgba(50,100,210,.28)}

/* Stat grid */
.stat-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:1px;background:rgba(255,255,255,.04);margin-bottom:13px;
}
.stat-cell{padding:8px 6px;text-align:center}
.card.winner .stat-cell{background:#0f0500}
.card.loser  .stat-cell{background:#060810}

.stat-v{display:block;font-size:1.25rem;font-weight:800;line-height:1;margin-bottom:2px}
.card.winner .stat-v{color:#d0d8e8}
.card.loser  .stat-v{color:#1e2a40}
.stat-n{font-size:.52rem;letter-spacing:.22em;text-transform:uppercase;color:#1e2a40;font-weight:700}

/* LC colours */
.lc-e{color:#22c55e !important}
.lc-m{color:#f59e0b !important}
.lc-h{color:#ef4444 !important}

/* Analysis */
.analysis{
  padding:9px 11px;border-left:2px solid;
  font-size:.76rem;line-height:1.55;font-weight:500;letter-spacing:.01em;
}
.card.winner .analysis{border-color:rgba(255,100,30,.38);background:rgba(255,40,0,.04);color:#7080a0}
.card.loser  .analysis{border-color:rgba(30,70,200,.25);background:rgba(10,20,60,.25);color:#2a3850}

/* ── VS spacer ──────────────────────────────────── */
.vs-col{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:10px;padding:0 4px;min-width:52px;
}
.vs-line-v{flex:1;width:1px;background:linear-gradient(to bottom,transparent,rgba(255,255,255,.06),transparent);min-height:60px}
.vs-lbl{font-size:1.6rem;font-weight:900;letter-spacing:.1em;color:#1a2030}

/* ── Download button ────────────────────────────── */
.dl-btn{
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.08);
  color:#2a3450;
  font-family:'Barlow Condensed',sans-serif;
  font-size:.72rem;font-weight:700;letter-spacing:.4em;text-transform:uppercase;
  padding:10px 26px;cursor:pointer;
  clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
  transition:all .2s;
}
.dl-btn:hover{background:rgba(255,255,255,.06);color:#5060a0;border-color:rgba(255,255,255,.14)}

/* ── Entrance animations ─────────────────────────── */
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUpWin{from{opacity:0;transform:translateY(28px) scale(1)}to{opacity:1;transform:translateY(0) scale(1.06)}}

.card.loser {animation:fadeUp .5s cubic-bezier(.22,1,.36,1) both}
.card.winner{animation:fadeUpWin .6s cubic-bezier(.22,1,.36,1) .08s both}

/* winner outer glow */
@keyframes outerGlow{
  0%,100%{filter:drop-shadow(0 0 18px rgba(255,70,10,.35)) drop-shadow(0 0 40px rgba(255,40,0,.12))}
  50%   {filter:drop-shadow(0 0 32px rgba(255,90,10,.6))  drop-shadow(0 0 70px rgba(255,40,0,.22))}
}
.card.winner{animation-fill-mode:both}
.card.winner .card-shell{animation:outerGlow 3s ease-in-out 0.6s infinite}

@media(max-width:760px){
  :root{--card-w:min(300px,88vw)}
  #cards-area{flex-direction:column;align-items:center}
  .vs-col{flex-direction:row;min-width:unset;width:90%;padding:4px 0}
  .vs-line-v{width:unset;height:1px;flex:1;min-height:unset}
  .card.winner{transform:scale(1.03)}
  .card.loser{transform:scale(1);opacity:.92}
}
</style>
</head>
<body>
<div id="bg-canvas"></div>
<div id="wrap" class="min-h-screen flex flex-col items-center">

  <!-- ── HEADER ── -->
  <header class="text-center pt-14 pb-8 px-4 w-full max-w-3xl">
    <div class="title-main">Cracked or Cooked</div>
    <div class="title-sub">Developer Battle Arena · v1.0</div>
    <div class="divider mt-5 max-w-xs mx-auto">
      <div class="divider-line" style="background:linear-gradient(90deg,transparent,rgba(255,100,30,.3))"></div>
      <div class="divider-diamond" style="background:#e06020;box-shadow:0 0 8px #e06020"></div>
      <div class="divider-line" style="background:linear-gradient(90deg,rgba(255,100,30,.3),transparent)"></div>
    </div>
  </header>

  <!-- ── FORM ── -->
  <section class="form-panel w-full max-w-2xl mx-4 p-6 mb-6" id="form-section">
    <div class="grid grid-cols-2 gap-6 mb-6">

      <!-- P1 -->
      <div>
        <div class="player-tag p1-tag">⚡ Player 1</div>
        <div class="flex flex-col gap-3">
          <div class="inp-wrap">
            <label>GitHub Username</label>
            <input id="user1" type="text" placeholder="torvalds" autocomplete="off"/>
          </div>
          <div class="inp-wrap">
            <label>LeetCode Username <span style="color:#1a2030">(optional)</span></label>
            <input id="lc1" type="text" placeholder="optional" autocomplete="off"/>
          </div>
        </div>
      </div>

      <!-- P2 -->
      <div>
        <div class="player-tag p2-tag">⚡ Player 2</div>
        <div class="flex flex-col gap-3">
          <div class="inp-wrap">
            <label>GitHub Username</label>
            <input id="user2" type="text" placeholder="gvanrossum" autocomplete="off"/>
          </div>
          <div class="inp-wrap">
            <label>LeetCode Username <span style="color:#1a2030">(optional)</span></label>
            <input id="lc2" type="text" placeholder="optional" autocomplete="off"/>
          </div>
        </div>
      </div>

    </div>
    <div class="flex justify-center">
      <button class="battle-btn" id="battle-btn" onclick="startBattle()">⚡ Battle</button>
    </div>
  </section>

  <!-- ── ERROR ── -->
  <div id="err-box" class="w-full max-w-2xl mx-4 mb-4"></div>

  <!-- ── LOADING ── -->
  <div id="loading" class="flex-col items-center gap-5 py-14 w-full">
    <div class="bar-loader">
      <div class="bbar"></div><div class="bbar"></div><div class="bbar"></div>
      <div class="bbar"></div><div class="bbar"></div><div class="bbar"></div>
      <div class="bbar"></div><div class="bbar"></div>
    </div>
    <div class="load-txt" id="load-txt">Analyzing codebases...</div>
  </div>

  <!-- ── RESULTS ── -->
  <div class="w-full max-w-5xl px-4 pb-20" id="result-wrap">

    <!-- Winner banner -->
    <div id="winner-section" class="text-center py-6">
      <div class="divider max-w-md mx-auto mb-4">
        <div class="divider-line" style="background:linear-gradient(90deg,transparent,rgba(255,100,30,.4))"></div>
        <div class="divider-diamond" style="background:#e06020;box-shadow:0 0 10px #e06020"></div>
        <div class="divider-diamond mx-2" style="background:#e06020;box-shadow:0 0 10px #e06020;width:5px;height:5px"></div>
        <div class="divider-diamond" style="background:#e06020;box-shadow:0 0 10px #e06020"></div>
        <div class="divider-line" style="background:linear-gradient(90deg,rgba(255,100,30,.4),transparent)"></div>
      </div>
      <div class="winner-headline" id="winner-hl"></div>
      <div class="divider max-w-md mx-auto mt-4">
        <div class="divider-line" style="background:linear-gradient(90deg,transparent,rgba(255,100,30,.4))"></div>
        <div class="divider-diamond" style="background:#e06020;box-shadow:0 0 10px #e06020"></div>
        <div class="divider-diamond mx-2" style="background:#e06020;box-shadow:0 0 10px #e06020;width:5px;height:5px"></div>
        <div class="divider-diamond" style="background:#e06020;box-shadow:0 0 10px #e06020"></div>
        <div class="divider-line" style="background:linear-gradient(90deg,rgba(255,100,30,.4),transparent)"></div>
      </div>
    </div>

    <!-- Cards -->
    <div id="cards-area" class="justify-center items-start gap-3 flex-wrap"></div>

    <!-- Download -->
    <div class="flex justify-center mt-8" id="dl-wrap" style="display:none!important">
      <button class="dl-btn" onclick="downloadCard()">↓ &nbsp;Download Battle Card</button>
    </div>

  </div>
</div>

<script>
const MSGS = [
  "Analyzing codebases...",
  "Counting your commits...",
  "Judging your tech stack...",
  "Consulting the AI overlords...",
  "Calculating cringe ratio...",
  "Examining LeetCode grind...",
  "Rendering the verdict...",
  "Checking for Stack Overflow copypasta...",
];

let loadTick;

function n(v){
  if(v==null||v===undefined)return'—';
  if(typeof v==='number'&&v>=1000)return(v/1000).toFixed(1)+'k';
  return String(v);
}

function setLoad(on){
  const el=document.getElementById('loading');
  if(on){el.classList.add('show');let i=0;loadTick=setInterval(()=>{document.getElementById('load-txt').textContent=MSGS[i++%MSGS.length]},1300)}
  else{el.classList.remove('show');clearInterval(loadTick)}
}
function showErr(msg){const e=document.getElementById('err-box');e.textContent=msg;e.classList.add('show')}
function hideErr(){document.getElementById('err-box').classList.remove('show')}

function buildCard(d, username, isWinner){
  const cls=isWinner?'winner':'loser';
  const ai=d.ai_analysis||{};
  const q=ai.quality_score??0;
  const isCracked=(d.verdict||'').toUpperCase().includes('CRACKED');
  const vc=isCracked?'cracked':'cooked';

  const card=document.createElement('div');
  card.className=`card ${cls}`;
  card.innerHTML=`
<div class="card-shell">
  <div class="card-inner">

    <div class="card-head">
      <div class="card-head-bg-text">${username.slice(0,6)}</div>
      <div class="c-tl"></div><div class="c-br"></div>
      <div class="card-head-name">${username}</div>
      <div class="card-head-sub">Developer</div>
    </div>

    <div class="card-body">
      <span class="verdict ${vc}">${d.verdict||'—'}</span>

      <div class="score-row">
        <span class="score-num">${n(d.score)}</span>
        <span class="score-lbl">Battle<br>Score</span>
      </div>

      <div class="bar-row">
        <div class="bar-hd">
          <span class="bar-hd-lbl">AI Quality Score</span>
          <span class="bar-hd-val">${q}<span style="font-size:.6em;opacity:.6">/100</span></span>
        </div>
        <div class="bar-track"><div class="bar-fill" data-w="${q}"></div></div>
      </div>

      <div class="sec-lbl">GitHub</div>
      <div class="stat-grid">
        <div class="stat-cell"><span class="stat-v">${n(d.public_repos)}</span><span class="stat-n">Repos</span></div>
        <div class="stat-cell"><span class="stat-v">${n(d.total_stars)}</span><span class="stat-n">Stars</span></div>
        <div class="stat-cell"><span class="stat-v">${n(d.followers)}</span><span class="stat-n">Followers</span></div>
      </div>

      <div class="sec-lbl">LeetCode</div>
      <div class="stat-grid">
        <div class="stat-cell"><span class="stat-v lc-e">${n(d.easy_solved)}</span><span class="stat-n">Easy</span></div>
        <div class="stat-cell"><span class="stat-v lc-m">${n(d.medium_solved)}</span><span class="stat-n">Med</span></div>
        <div class="stat-cell"><span class="stat-v lc-h">${n(d.hard_solved)}</span><span class="stat-n">Hard</span></div>
      </div>

      <div class="analysis">${ai.analysis||'No analysis available.'}</div>
    </div>

  </div>
</div>`;
  return card;
}

function renderResult(data, u1, u2){
  const w=data.winner;
  const u1win=w===u1;

  // Banner
  const hl=document.getElementById('winner-hl');
  hl.innerHTML=`<span class="winner-hl-name">${w}</span><span class="winner-hl-suffix"> IS CRACKED 🔥</span>`;
  document.getElementById('winner-section').classList.add('show');

  // Cards
  const area=document.getElementById('cards-area');
  area.innerHTML='';

  const c1=buildCard(data.user1,u1,u1win);
  const c2=buildCard(data.user2,u2,!u1win);

  const vs=document.createElement('div');
  vs.className='vs-col';
  vs.innerHTML='<div class="vs-line-v"></div><div class="vs-lbl">VS</div><div class="vs-line-v"></div>';

  area.appendChild(c1);area.appendChild(vs);area.appendChild(c2);
  area.classList.add('show');

  // dl button
  document.getElementById('dl-wrap').style.removeProperty('display');

  // animate quality bars
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    area.querySelectorAll('.bar-fill').forEach(b=>b.style.width=b.dataset.w+'%');
  }));

  document.getElementById('result-wrap').scrollIntoView({behavior:'smooth',block:'start'});
}

async function startBattle(){
  const u1=document.getElementById('user1').value.trim();
  const u2=document.getElementById('user2').value.trim();
  const lc1=document.getElementById('lc1').value.trim();
  const lc2=document.getElementById('lc2').value.trim();

  if(!u1||!u2){showErr('Enter both GitHub usernames to begin the battle.');return}

  hideErr();
  document.getElementById('winner-section').classList.remove('show');
  document.getElementById('cards-area').classList.remove('show');
  document.getElementById('cards-area').innerHTML='';
  document.getElementById('dl-wrap').style.setProperty('display','none','important');

  const btn=document.getElementById('battle-btn');
  btn.disabled=true;
  setLoad(true);

  let qs=`user1=${encodeURIComponent(u1)}&user2=${encodeURIComponent(u2)}`;
  if(lc1)qs+=`&lc1=${encodeURIComponent(lc1)}`;
  if(lc2)qs+=`&lc2=${encodeURIComponent(lc2)}`;

  try{
    const r=await fetch(`http://localhost:8000/compare?${qs}`);
    const d=await r.json();
    if(d.error){showErr(`Error: ${d.error}`);return}
    renderResult(d,u1,u2);
  }catch(e){
    showErr('Could not reach the backend. Make sure it\'s running on localhost:8000.');
  }finally{
    setLoad(false);btn.disabled=false;
  }
}

document.addEventListener('keydown',e=>{if(e.key==='Enter')startBattle()});
</script>
</body>
</html>
